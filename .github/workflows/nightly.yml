name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      patchRelease:
        description: 'Make a patch release'
        required: false
        type: boolean

jobs:
  package:
    name: Package Extension
    uses: ./.github/workflows/package.yml
    with:
      mode: ${{ inputs.patchRelease && 'patch' || 'release' }}
      buildPreRelease: true

  tests_release:
    name: Test Release
    needs: package
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.18
    with:
      needs_token: true
      # Linux
      # Run against all of the swift versions from https://github.com/swiftlang/github-workflows/blob/main/.github/workflows/swift_package_test.yml#L44
      # except the snapshots, which are covered by nightly-snapshots.yml. Keep in sync with that file.
      linux_exclude_swift_versions: '[{"swift_version": "nightly-main"}, {"swift_version": "nightly-6.4.x"}]'
      linux_env_vars: |
        NVM_DIR=/usr/local/nvm
        CI=1
        VSCODE_SWIFT_VSIX_ID=${{needs.package.outputs.artifact-id}}
        GITHUB_REPOSITORY=${{github.repository}}
      linux_pre_build_command: . .github/workflows/scripts/setup-linux.sh
      linux_build_command: ./scripts/test.sh
      # Windows
      # Run against all of the swift versions from https://github.com/swiftlang/github-workflows/blob/main/.github/workflows/swift_package_test.yml#L85
      # except the snapshots, which are covered by nightly-snapshots.yml. Keep in sync with that file.
      windows_exclude_swift_versions: '[{"swift_version": "nightly-main"}, {"swift_version": "nightly-6.4.x"}]'
      windows_env_vars: |
        CI=1
        VSCODE_SWIFT_VSIX_ID=${{needs.package.outputs.artifact-id}}
        GITHUB_REPOSITORY=${{github.repository}}
      windows_pre_build_command: . .github\workflows\scripts\windows\setup.ps1
      windows_build_command: Invoke-Program scripts\test_windows.ps1
      enable_windows_docker: false
