name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  package:
    name: Package Extension
    uses: ./.github/workflows/package.yml
    with:
      mode: dev

  tests:
    name: ${{ contains(github.event.pull_request.labels.*.name, 'full-test-run') && 'Full Test Run' || 'Fast Test Run'}}
    needs: package
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.19
    with:
      needs_token: true
      # Linux
      # Fast runs skip the Swift snapshots. Bump nightly-6.4.x when a new release branch is cut.
      linux_exclude_swift_versions: "${{ contains(github.event.pull_request.labels.*.name, 'full-test-run') && '[]' || '[{\"swift_version\": \"nightly-6.4.x\"}, {\"swift_version\": \"nightly-main\"}]' }}"
      linux_env_vars: |
        NVM_DIR=/usr/local/nvm
        CI=1
        FAST_TEST_RUN=${{ contains(github.event.pull_request.labels.*.name, 'full-test-run') && '0' || '1'}}
        VSCODE_SWIFT_VSIX_ID=${{needs.package.outputs.artifact-id}}
        GITHUB_REPOSITORY=${{github.repository}}
      linux_pre_build_command: . .github/workflows/scripts/setup-linux.sh
      linux_build_command: ./scripts/test.sh
      # Windows
      # Fast runs skip the Swift snapshots. Bump nightly-6.4.x when a new release branch is cut.
      windows_exclude_swift_versions: "${{ contains(github.event.pull_request.labels.*.name, 'full-test-run') && '[]' || '[{\"swift_version\": \"nightly-6.4.x\"}, {\"swift_version\": \"nightly-main\"}]' }}"
      windows_env_vars: |
        CI=1
        FAST_TEST_RUN=${{ contains(github.event.pull_request.labels.*.name, 'full-test-run') && '0' || '1'}}
        VSCODE_SWIFT_VSIX_ID=${{needs.package.outputs.artifact-id}}
        GITHUB_REPOSITORY=${{github.repository}}
      windows_pre_build_command: . .github\workflows\scripts\windows\setup.ps1
      windows_build_command: Invoke-Program scripts\test_windows.ps1
      enable_windows_docker: false

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.18
    with:
      # Pending https://github.com/swiftlang/vscode-swift/pull/1176
      license_header_check_enabled: false
      license_header_check_project_name: "VS Code Swift"
      api_breakage_check_enabled: false
      docs_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: true
      unacceptable_language_check_enabled: true
